site_name: Документация
site_url: https://polekhina01.github.io/  
site_description: Автоматически генерируемая документация

repo_url: https://github.com/polekhina01/polekhina01.github.io  
repo_name: polekhina01/polekhina01.github.io

theme:
  name: material
  palette:
    primary: blue
    accent: blue
  features:
    - navigation.tabs
    - navigation.sections
    - search.suggest
    - search.highlight

plugins:
  - search

markdown_extensions:
  - toc:
      permalink: true
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences

nav:
  - Главная: index.md
  - Документы:
      - 01-01-00-01-00 ПЗ СП_cleaned:
          - 01-01-00-01-00 ПЗ.СП_cleaned: 01-01-00-01-00 ПЗ СП_cleaned/01-01-00-01-00 ПЗ.СП_cleaned.md
          - 01-01-00-01-00 ПЗ.СП_cleaned_fin: 01-01-00-01-00 ПЗ СП_cleaned/01-01-00-01-00 ПЗ.СП_cleaned_fin.md
          - 01-01-00-01-00 ПЗ.СП_cleaned_pre: 01-01-00-01-00 ПЗ СП_cleaned/01-01-00-01-00 ПЗ.СП_cleaned_pre.md
      - 1: 1/1.md
      - 1 2_29899-ХП3-ПД-КВ-ОПЗ_cleaned (1):
          - 1.2_29899-ХП3-ПД-КВ-ОПЗ_cleaned (1): 1 2_29899-ХП3-ПД-КВ-ОПЗ_cleaned (1)/1.2_29899-ХП3-ПД-КВ-ОПЗ_cleaned (1).md
          - 1.2_29899-ХП3-ПД-КВ-ОПЗ_cleaned (1)_fin: 1 2_29899-ХП3-ПД-КВ-ОПЗ_cleaned (1)/1.2_29899-ХП3-ПД-КВ-ОПЗ_cleaned (1)_fin.md
          - 1.2_29899-ХП3-ПД-КВ-ОПЗ_cleaned (1)_pre: 1 2_29899-ХП3-ПД-КВ-ОПЗ_cleaned (1)/1.2_29899-ХП3-ПД-КВ-ОПЗ_cleaned (1)_pre.md
      - 29900-ПД-КВ-ОПЗ(1)_cleaned:
